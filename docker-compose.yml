services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Sem POSTGRES_DB o entrypoint cria um banco com o nome do usuário, e o
      # CREATE DATABASE mfacrud do init script falharia. Fixa o banco padrão em `postgres`.
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 usa PGDATA em /var/lib/postgresql/18/docker; o volume monta o diretório pai.
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # O browser fala com localhost:8080 e a API, de dentro da rede do compose, com keycloak:8080.
      # Fixar o hostname mantém o `iss` sempre em localhost (é o que o token carrega); o backchannel
      # dinâmico deixa o discovery devolver o host de quem perguntou, para a API achar o JWKS.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Resolvido pelo placeholder ${MFACRUD_ADMIN_SVC_SECRET} dentro do realm-export.json (M1).
      MFACRUD_ADMIN_SVC_SECRET: ${MFACRUD_ADMIN_SVC_SECRET}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # A imagem não tem curl; usa o socket TCP do bash contra a porta de management (9000).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # Coletor OTLP + UI de traces, métricas e logs estruturados. É só para desenvolvimento: sobe sem
  # autenticação e guarda tudo em memória, então reiniciar limpa o histórico.
  telemetry:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
      # O browser posta OTLP/HTTP direto de :5173, então o coletor precisa liberar essa origem.
      DASHBOARD__OTLP__CORS__ALLOWEDORIGINS: http://localhost:5173
      DASHBOARD__OTLP__CORS__ALLOWEDHEADERS: "*"
    ports:
      - "18888:18888"
      - "18890:18890"

  api:
    build:
      context: .
      dockerfile: src/MfaCrud.Api/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: mfacrud-api
      # Development também no container: é o que aplica as migrations no startup, expõe o
      # /openapi e dispensa HTTPS no metadata (tudo aqui é http em localhost).
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=mfacrud;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Metadata e JWKS pelo nome interno; `iss` esperado é o que o browser usa.
      Keycloak__Authority: http://keycloak:8080/realms/mfacrud
      Keycloak__Issuer: http://localhost:8080/realms/mfacrud
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__Audience: mfacrud-api
      Keycloak__Realm: mfacrud
      Keycloak__AdminClientId: mfacrud-admin-svc
      Keycloak__AdminClientSecret: ${MFACRUD_ADMIN_SVC_SECRET}
      Cors__AllowedOrigins__0: http://localhost:5173
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      telemetry:
        condition: service_started
    healthcheck:
      # A imagem não tem curl e o /bin/sh é dash (sem /dev/tcp), por isso o bash explícito.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q 'Healthy' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
